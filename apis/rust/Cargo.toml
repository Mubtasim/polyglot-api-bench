[package]
name = "rust-api"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
axum = "=0.8.9"
bcrypt = "=0.19.3"
chrono = { version = "0.4.45", default-features = false, features = ["serde"] }
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "chrono", "macros"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time"] }

[profile.release]
lto = true
codegen-units = 1
