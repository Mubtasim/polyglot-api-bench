name: polyglot-api-bench

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: bench
      POSTGRES_PASSWORD: bench
      POSTGRES_DB: bench
    command: postgres -c max_connections=200
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bench -d bench"]
      interval: 2s
      timeout: 3s
      retries: 30

  go:
    build: ./apis/go
    image: ghcr.io/mubtasim/polyglot-api-bench-go:${TAG:-local}
    <<: &api
      environment:
        DATABASE_URL: postgres://bench:bench@postgres:5432/bench
        DB_CONNECTION: Host=postgres;Username=bench;Password=bench;Database=bench;Maximum Pool Size=20;Gss Encryption Mode=Disable
      mem_limit: 1g
      depends_on:
        postgres:
          condition: service_healthy
    ports: ["8001:8080"]

  rust:
    build: ./apis/rust
    image: ghcr.io/mubtasim/polyglot-api-bench-rust:${TAG:-local}
    <<: *api
    ports: ["8002:8080"]

  dotnet:
    build: ./apis/dotnet
    image: ghcr.io/mubtasim/polyglot-api-bench-dotnet:${TAG:-local}
    <<: *api
    ports: ["8003:8080"]

  node:
    build: ./apis/node
    image: ghcr.io/mubtasim/polyglot-api-bench-node:${TAG:-local}
    <<: *api
    ports: ["8004:8080"]
